/label></div><label class="flex items-center gap-2 mt-4 text-sm"><input type=checkbox checked value=on><span class=text-slate-600>Machine en marche</span></label><button class="mt-5 bg-emeraude hover:bg-emerald-700 text-white font-semibold rounded-lg px-5 py-2.5 text-sm transition">Envoyer la trame</button></div><div class="bg-white rounded-2xl shadow-sm p-5"><h2 class="font-semibold text-ink mb-3">Scénarios rapides</h2><div class=space-y-2><button class="w-full text-left px-3 py-2 rounded-lg border border-slate-200 hover:border-emeraude hover:bg-emerald-50 text-sm text-slate-700 transition">Marche nominale</button><button class="w-full text-left px-3 py-2 rounded-lg border border-slate-200 hover:border-emeraude hover:bg-emerald-50 text-sm text-slate-700 transition">Vibration élevée (usure)</button><button class="w-full text-left px-3 py-2 rounded-lg border border-slate-200 hover:border-emeraude hover:bg-emerald-50 text-sm text-slate-700 transition">Surchauffe palier</button><button class="w-full text-left px-3 py-2 rounded-lg border border-slate-200 hover:border-emeraude hover:bg-emerald-50 text-sm text-slate-700 transition">Surtension</button><button class="w-full text-left px-3 py-2 rounded-lg border border-slate-200 hover:border-emeraude hover:bg-emerald-50 text-sm text-slate-700 transition">Arrêt machine</button></div><p class="text-xs text-slate-400 mt-3">Cliquez un scénario, ajustez si besoin, puis « Envoyer ». Les alertes déclenchées apparaissent dans Maintenance.</p></div></div></main></div></div>
 
<script>
// nav.js — navigation locale du clone statique (aucun accès réseau).
// Généré par scripts/build.py — modifier la config dans build.py, pas ici.
(function () {
  "use strict";

  var PAGE = location.pathname.split("/").pop() || "index.html";
  var ROUTES = {"machines.html": [["re:▸", "machines--selected.html"]], "machines--selected.html": [["re:▸", "machines--selected.html"]], "maintenance.html": [["Créer l'OT", "maintenance--form.html"]]};
  var VARIANT_BASE = {"maintenance--form.html": "maintenance.html", "machines--selected.html": "machines.html"};
  var PLUS_MENU = [["🏭 Structure", "structure.html"], ["📡 Boîtiers", "boitiers.html"], ["👷 Opérateurs", "operateurs.html"], ["📚 Historique", "historique.html"], ["🔖 Traçabilité", "tracabilite.html"], ["📱 QR Codes", "qrcodes.html"], ["🔗 Intégration", "integration.html"], ["🎛️ Simulateur", "simulateur.html"], ["⚙️ Paramètres", "parametres.html"]];

  function norm(s) {
    return (s || "").replace(/\s+/g, " ").trim();
  }

  function closeModal() {
    if (document.referrer &&
        document.referrer.indexOf(location.origin) === 0) {
      history.back();
    } else {
      location.href = VARIANT_BASE[PAGE] || "index.html";
    }
  }

  var CLOSE_RE =
    /annuler|cancel|fermer|close|discard|enregistrer|save|créer|creer|create|planifier|schedule|lancer|confirmer|confirm|valider|validate|soumettre|submit|✅/i;

  // Menu « Plus » : absent du DOM capturé -> rebuild local
  var plusOpen = null;
  function togglePlus(btn) {
    var host = btn.parentElement;
    var menu = host && host.querySelector(".plus-menu-local");
    if (menu) { menu.remove(); plusOpen = null; return; }
    if (plusOpen) { plusOpen.remove(); plusOpen = null; }
    var div = document.createElement("div");
    div.className = "plus-menu-local";
    div.setAttribute(
      "style",
      "position:absolute;right:0;top:100%;margin-top:8px;width:200px;" +
      "background:#fff;border-radius:12px;box-shadow:0 10px 25px rgba(0,0,0,.18);" +
      "border:1px solid #e2e8f0;padding:6px 0;z-index:9999;"
    );
    PLUS_MENU.forEach(function (it) {
      var a = document.createElement("a");
      a.href = it[1];
      a.textContent = it[0];
      a.setAttribute(
        "style",
        "display:block;padding:8px 16px;font-size:14px;color:#1e293b;text-decoration:none;"
      );
      a.onmouseenter = function () { this.style.background = "#f1f5f9"; };
      a.onmouseleave = function () { this.style.background = ""; };
      div.appendChild(a);
    });
    host.style.position = "relative";
    host.appendChild(div);
    plusOpen = div;
  }

  document.addEventListener("click", function (e) {
    var btn = e.target.closest("button, [role=button], .cursor-pointer, a");
    if (!btn) {
      if (plusOpen) { plusOpen.remove(); plusOpen = null; }
      return;
    }
    var label = norm(btn.textContent);

    // Menu « Plus » du clone
    if (PLUS_MENU.length && /plus|⋯|\.\.\./i.test(label) &&
        !btn.closest(".plus-menu-local")) {
      e.preventDefault();
      togglePlus(btn);
      return;
    }
    if (plusOpen && !btn.closest(".plus-menu-local")) {
      plusOpen.remove(); plusOpen = null;
    }

    var inModal = !!btn.closest("div.fixed.inset-0");
    var isVariant = PAGE.indexOf("--") !== -1;

    if (inModal) {
      // Dans une vraie modale overlay : X/vide ou bouton de clôture -> retour
      if (!label || CLOSE_RE.test(label)) {
        e.preventDefault();
        closeModal();
      }
      return;
    }
    // Sur une page variante (formulaire inline, carte détail) : boutons de
    // clôture, « Retour… » ou flèche ← -> retour ; les autres passent par les règles.
    if (isVariant && (btn.querySelector("svg.lucide-arrow-left") ||
        (label && (/retour|back|←/i.test(label) || CLOSE_RE.test(label))))) {
      e.preventDefault();
      closeModal();
      return;
    }

    var rules = ROUTES[PAGE] || [];
    for (var i = 0; i < rules.length; i++) {
      var pat = rules[i][0], target = rules[i][1];
      var match;
      if (pat.indexOf("icon:") === 0) {
        // Bouton sans texte identifiable par icône lucide (ex. icon:eye)
        match = !!btn.querySelector("svg.lucide-" + pat.slice(5));
      } else {
        match =
          pat.indexOf("re:") === 0
            ? new RegExp(pat.slice(3), "i").test(label)
            : label.toLowerCase().indexOf(pat.toLowerCase()) !== -1;
      }
      if (match) {
        e.preventDefault();
        location.href = target;
        return;
      }
    }

    if (/^actualiser$/i.test(label)) {
      e.preventDefault();
      location.reload();
    }
  });

  // Bouton flottant « ← Hub TNtrace » dans chaque produit + « Déconnexion » -> hub
  (function injectHubBtn() {
    var a = document.createElement("a");
    a.href = "../index.html";
    a.className = "tntrace-hub-back";
    a.innerHTML = "&#8592; Hub TNtrace";
    a.setAttribute(
      "style",
      "position:fixed;bottom:16px;right:16px;z-index:9998;" +
      "display:inline-flex;align-items:center;gap:6px;" +
      "padding:8px 14px;border-radius:999px;" +
      "background:linear-gradient(135deg,#0f172a,#1e3a8a);color:#fff;" +
      "font:600 12.5px/1 Inter,system-ui,sans-serif;text-decoration:none;" +
      "box-shadow:0 8px 24px rgba(15,23,42,.28);border:1px solid rgba(255,255,255,.16);" +
      "transition:transform .15s,box-shadow .15s;"
    );
    a.onmouseenter = function () { this.style.transform = "translateY(-2px)"; };
    a.onmouseleave = function () { this.style.transform = ""; };
    document.body.appendChild(a);

    // Clic sur « Déconnexion / Logout » -> retour au hub
    document.addEventListener("click", function (ev) {
      var b = ev.target.closest("button, a");
      if (!b) return;
      var t = norm(b.textContent);
      if (/^(déconnexion|deconnexion|logout|log out|se déconnecter)$/i.test(t) ||
          b.querySelector("svg.lucide-log-out")) {
        ev.preventDefault();
        location.href = "../index.html";
      }
    });
  })();
})();

</script>
